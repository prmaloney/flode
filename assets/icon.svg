<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>flode icon, option 6: a lowercase f built from wired nodes</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#262836"/>
      <stop offset="1" stop-color="#14151b"/>
    </linearGradient>
    <clipPath id="small"><rect width="88" height="58" rx="12"/></clipPath>
    <clipPath id="tall"><rect width="100" height="372" rx="14"/></clipPath>
    <g id="node">
      <rect width="88" height="58" rx="12" fill="#3c3d49"/>
      <rect width="88" height="18" fill="#4a4d61" clip-path="url(#small)"/>
    </g>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- the stem: one tall node -->
  <g transform="translate(80 70)">
    <rect width="100" height="372" rx="14" fill="#3c3d49"/>
    <rect width="100" height="22" fill="#4a4d61" clip-path="url(#tall)"/>
  </g>

  <!-- the top bar: two nodes. the middle bar: one node. -->
  <use href="#node" x="222" y="70"/>
  <use href="#node" x="342" y="70"/>
  <use href="#node" x="222" y="190"/>

  <!-- wires -->
  <g fill="none" stroke-width="10" stroke-linecap="round">
    <path d="M180 99H222" stroke="#59d973"/>
    <path d="M310 99H342" stroke="#6badff"/>
    <path d="M180 219H222" stroke="#b37af2"/>
  </g>

  <!-- pins -->
  <g stroke="#14151b" stroke-width="5">
    <circle cx="180" cy="99" r="9" fill="#59d973"/>
    <circle cx="222" cy="99" r="9" fill="#59d973"/>
    <circle cx="310" cy="99" r="9" fill="#6badff"/>
    <circle cx="342" cy="99" r="9" fill="#6badff"/>
    <circle cx="180" cy="219" r="9" fill="#b37af2"/>
    <circle cx="222" cy="219" r="9" fill="#b37af2"/>
  </g>
</svg>
